spring.application.name=catalog
server.servlet.context-path=/catalog
server.port=8081


# Data Base Confifg
spring.datasource.url=jdbc:postgresql://localhost:5432/catalogService
spring.datasource.username=Goku
spring.datasource.password=Goku
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true


# RabbitMQ Config
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
spring.rabbitmq.listener.simple.retry.enabled=true

catalog.exchange=catalog
